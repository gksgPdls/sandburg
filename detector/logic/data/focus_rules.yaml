# 주목 규칙 표 — 보험금이 걸린 칸을 짚고(주목), 같은 서류 안의 다른 칸과 모순이면 판정(검사)한다.
# 설계·결과: docs/주목규칙_설계.md. 코드: detector_v2/logic/focus.py
#
# 원칙
#   - 모든 줄에 출처 원문(quote)과 링크(url)를 단다. 출처를 못 찾은 것은 not_found 에만 적고 규칙으로 쓰지 않는다.
#   - why_source(이 칸이 왜 보험금을 정하나)만 있으면 '주목'까지만. 판정 등급은 checks 의 source 가 있을 때만 준다.
#   - quote 는 원문에서 그대로 옮긴 문장. PDF/HWP 추출이라 줄바꿈·띄어쓰기만 다를 수 있다.
#   - verified: 따로 적지 않은 quote 는 모두 원문대조(내려받은 원문 PDF/HWP/HTML/JSON에서 같은 문장 확인, 2026-10-30).
#               요약인용 = 웹페이지 요약에서 얻어 글자 단위 대조를 못 한 것 → 판정 근거로 쓰지 않음
#   - 상품약관 조건(예: 심재성 2도 이상)은 상품·특약마다 다르다. 확인한 상품 수를 note 에 적고, 판정 근거로는 쓰지 않는다.
#   - checks.status: 구현(focus.py 에서 검사) / 서류필요(진단서 한 장으로는 못 봄: 병리결과지·계약일·영수증 등) / 후보(근거 약함)
# 확인일: 2026-10-30

checked: 2026-10-30

common_sources:
  std_terms: &std_terms
    type: 표준약관
    name: "보험업감독업무시행세칙 [별표15] 표준약관 ('26.8.28. 개정, 금감원 2026-09-11 게시)"
    url: https://www.fss.or.kr/fss/bbs/B0000115/view.do?nttId=227751&menuNo=200143
  kcd_t20: &kcd_t20
    type: KCD
    name: "KCD-8 T20-T25 (KOICD 열람)"
    url: https://www.koicd.kr/kcd/popKcd.do?degree=08&kcd=T20
  fss_tip70: &fss_tip70
    type: 금감원
    name: "금융감독원 보도참고자료 「금융꿀팁 200선 - 암보험 가입자가 꼭 알아야 할 필수정보」 (2017.11.3.)"
    url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=13720&menuNo=200218
  fss_260604: &fss_260604
    type: 금감원
    name: "금융위·금감원 보도자료 「AI 시대 진화하는 보험사기, 범정부 공조로 국민들의 보험금 누수 막아낸다」 (2026-06-04)"
    url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=218180&menuNo=200218

items:
  # ───────────────────────────────────────────────────────── 화상
  - id: BURN
    name: 화상
    doc: diagnosis
    trigger: {kcd: ["T20-T25"], words: ["화상"]}
    focus:
      - {field: diagnoses, what: "질병분류기호 4번째 자리(.1 1도 / .2 2도 / .3 3도, 부식은 .5/.6/.7)"}
      - {field: opinion, what: "화상 깊이 표현(표재성·심재성), 치료기간"}
    why: "화상진단비·화상수술비는 화상 깊이로 지급 여부가 갈린다. KCD에는 표재성/심재성 2도를 나누는 코드가 없어 '심재성'은 글자로만 확인된다."
    why_source:
      - type: 상품약관
        name: "삼성화재 미니생활보험(2023.7.24) 화상진단비(심재성 2도이상) 특별약관"
        clause: "제3조 화상의 정의 (PDF p.96)"
        quote: "이 특별약관 계약에 있어서 \"화상\"이라 함은 \"한국표준질병사인분류\"에 의하여【별표 4】에서 정하는 \"화상분류표\"에 정한 화상(열상 포함)에 해당되고, 심재성 2 도 이상에 해당하는 화상을 말합니다."
        url: https://www.samsungfire.com/publication/pdf/KR1571P_0_20230724_file1.pdf
      - type: 상품약관
        name: "현대해상 Hi-주택화재상해보험 화상진단보장 특별약관"
        clause: "제1조 ②항 (PDF p.50)"
        quote: "② 제 1 항에서 \"화상\"이라 함은 【별표 2】의 화상분류표에서 정한 화상(열상을 포함합니다)에 해당되고 심재성 2 도 이상의 화상을 말합니다"
        url: https://direct.hi.co.kr/dh/terms/CM4960_20250901.pdf
      - type: 상품약관
        name: "삼성화재 행복한 안심파트너 1-52 화상 진단비 특별약관"
        clause: "제1조 ②항 (PDF p.187)"
        quote: "심재성 2도 이상에 해당하는 화상을 말합니다."
        url: https://www.samsungfire.com/product/leaflet/P02_02_04_023_20200701.pdf
      - type: 상품약관
        name: "삼성화재 미니생활보험 화상진단비(2도이상) 특별약관 [반례: 표재성도 지급]"
        clause: "제3조 (PDF p.92)"
        quote: "2 도 이상(표재성, 심재성을 포함합니다)에 해당하는 화상을 말합니다."
        url: https://www.samsungfire.com/publication/pdf/KR1571P_0_20230724_file1.pdf
      - <<: *kcd_t20
        name: "KCD-9 T20 4단위 (KOICD 열람; 심평원 상병마스터 2025.9 병명과도 같음)"
        url: https://www.koicd.kr/kcd/kcd9.do?kcd=T20
        clause: "T20.0~T20.7 (T21~T25 같은 구조)"
        quote: "T20.0 머리 및 목의 상세불명 정도의 화상 / T20.1 머리 및 목의 1도 화상 / T20.2 머리 및 목의 2도 화상 / T20.3 머리 및 목의 3도 화상 / T20.4 머리 및 목의 상세불명 정도의 부식 / T20.5 머리 및 목의 1도 부식 / T20.6 머리 및 목의 2도 부식 / T20.7 머리 및 목의 3도 부식"
    note: "상품약관 2개사 4개 상품 확인: 진단비는 '심재성 2도 이상'이 많지만 같은 회사에 '2도 이상(표재성 포함)', '3도 이상' 특약도 있음. 화상수술비는 3개 중 2개가 깊이 조건 없음."
    checks:
      - id: BURN-DEPTH
        status: 구현
        grade: 참고
        caveat: "부위가 여러 곳이면 깊이가 다른 화상이 함께 있을 수 있음 (보수 원칙으로 확인 필요)"
        rule: "소견·병명에 적힌 화상 깊이(1도·2도·3도, 심재성/표재성 = 2도)와 질병분류기호 4번째 자리가 다르면 모순"
        source:
          <<: *kcd_t20
          quote: "2도의 화상 및 부식[수포][표피상실] / 3도의 화상 및 부식[밑에 있는 조직의 심부괴사][전층피부손실]"
      - id: BURN-DEEP-SHORT
        status: 구현
        grade: 참고
        rule: "'심재성(깊은) 2도'인데 향후 치료기간이 2주 이하로 적혀 있으면 깊이 표기를 의심 (회복기간 출처가 '3주 이상'과 '2~4주'로 갈려 판정 근거로는 약함 → 참고)"
        source:
          type: 공공의료정보
          name: "질병관리청 국가건강정보포털 '화상' (업데이트 2026-06-04)"
          quote: "깊은 2도 화상은 3주 이상의 비교적 긴 회복기간이 필요하며 흉터와 색소 침착을 흔히 남깁니다."
          url: https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6584
        source_2:
          type: 병원의학정보
          name: "서울대학교병원 N의학정보 '화상'"
          quote: "- 심부 2도 화상 : 진피층의 대부분이 손상된 상태로 감염이 없을 경우에는 2~4주 후에 회복되며 흉터가 남는다."
          url: https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA001094
    fraud_cases: []
    not_found:
      - "화상 진단서 조작을 다룬 금감원 보도자료"
      - "'심재성 2도면 피부이식'을 직접 말하는 공식 문장"

  # ───────────────────────────────────────────────────────── 골절
  - id: FRACTURE
    name: 골절
    doc: diagnosis
    trigger: {kcd: ["S02", "S07", "S09.9", "S12", "S22", "S32", "S42", "S52", "S62", "S72", "S82", "S92", "T02", "T08", "T10", "T12", "T14.2"],
              words: ["골절"]}
    focus:
      - {field: diagnoses, what: "질병분류기호(골절 S_2 ↔ 염좌 S_3·타박 S_0), 치아파절 S02.5 여부"}
      - {field: opinion, what: "손상 종류(골절·염좌·타박), 영상검사·고정 여부"}
    why: "골절분류표 코드면 골절진단비가 나오고 같은 부위의 염좌·타박은 나오지 않는다. (조작 동기는 약관과 KCD를 맞대어 본 추론이며 직접 진술한 공식 문장은 없다)"
    why_source:
      - type: 상품약관
        name: "삼성화재 미니생활보험 골절진단비 특별약관"
        clause: "제1조 ① (PDF p.86)"
        quote: "【별표3】(골절분류표)에 정한 골절(이하「골절」이라 합니다)로 진단확정된 경우 보험증권에 기재된 금액을 보험수익자(보험수익자의 지정이 없을 때에는 피보험자)에게 지급합니다."
        url: https://www.samsungfire.com/publication/pdf/KR1571P_0_20230724_file1.pdf
      - type: 상품약관
        name: "삼성화재 미니생활보험 골절진단비(치아파절제외) 특별약관"
        clause: "제1조 ① (PDF p.87)"
        quote: "치아의 파절 및 파절치(S02.5)는 보상하여 드리지 않습니다"
        url: https://www.samsungfire.com/publication/pdf/KR1571P_0_20230724_file1.pdf
      - type: KCD
        name: "KCD-9 S93 (염좌는 골절과 다른 범주)"
        clause: S93
        quote: "발목 및 발 부위의 관절 및 인대의 탈구, 염좌 및 긴장"
        url: https://www.koicd.kr/kcd/kcd9.do?kcd=S93
    checks:
      - id: FX-KIND
        status: 구현
        grade: 참고
        caveat: "'골절 의증', 다른 부위 골절, 부상병의 염좌 등 정상적으로 함께 적히는 경우가 있음 (보수 원칙으로 확인 필요)"
        rule: "질병분류기호는 골절(S_2 등 골절분류표 범위)인데 소견은 염좌·긴장·타박이거나 '골절 소견 없음'이면 모순 (반대로 염좌 코드인데 소견이 골절이어도 모순)"
        source:
          type: KCD
          name: "KCD-9 S93 vs S82"
          quote: "발목 및 발 부위의 관절 및 인대의 탈구, 염좌 및 긴장"
          url: https://www.koicd.kr/kcd/kcd9.do?kcd=S93
      - id: FX-OPEN
        status: 후보
        rule: "병명 '개방성'이면 코드 5번째 자리 1, '폐쇄성'·표기 없음이면 0 (병명-코드 대조는 기존 C2 상병마스터 규칙이 이미 봄)"
        source:
          type: KCD
          name: "KCD-9 S42 주석"
          quote: "폐쇄성 및 개방성으로 명시되지 않은 골절은 폐쇄성으로 분류되어야 한다."
          verified: 요약인용
          url: https://www.koicd.kr/kcd/kcd9.do?kcd=S42
    fraud_cases: []
    not_found:
      - "염좌·타박을 골절로 바꾸는 조작을 직접 언급한 금감원 보도자료나 공식 문장"
      - "골절에 영상검사가 필수라는 공식 출처 (그래서 '영상검사 없는 골절' 규칙은 넣지 않음)"

  # ───────────────────────────────────────────────────────── 암·유사암
  - id: CANCER
    name: 암·유사암
    doc: diagnosis
    trigger: {kcd: ["C00-C97", "D00-D09", "D37-D48"], words: ["암", "악성 신생물", "제자리암", "상피내암", "경계성"]}
    focus:
      - {field: diagnoses, what: "C(일반암) / C44·C73·D00~D09·D37~D48(유사암·소액암), C77~C80이면 원발부위"}
      - {field: dates.diagnosis, what: "진단 연월일 = 조직검사 결과보고일이어야 함"}
      - {field: opinion, what: "조직검사 결과(제자리·상피내·경계성 표현), 결과보고일"}
    why: "같은 신생물이라도 일반암(C)과 유사암(D·C44·C73)의 진단비가 크게 다르고(확인한 약관에서 10~30%), 진단확정일이 보장개시일(계약 후 90일)·감액기간을 가른다."
    why_source:
      - type: 상품약관
        name: "KB라이프 무배당 KB단체암진단특약 약관 <별표1> 보험금 지급기준표"
        clause: 별표1
        quote: "피보험자가 보험기간 중 보장개시일 이후에 “제자리암”으로 진단이 확정되었을 경우(단, 최초 1회한) 특약보험가입금액의 10%"
        url: https://www.kblife.co.kr/api/archive/archives/download/product-terms/501618431/2
      - type: 상품약관
        name: "KB라이프 무배당 3대질병보험료납입면제특약Ⅱ 제3조④ (같은 취지 문장을 확인한 4개 상품 모두에서 확인)"
        clause: 제3조④
        quote: "“암”, “기타피부암” 및 “갑상선암”의 진단확정은 병리 또는 진단검사의학의 전문의 자격증을 가진 자에 의하여 내려져야 하며"
        url: https://www.kblife.co.kr/api/archive/archives/download/product-terms/501618375/2
      - <<: *fss_tip70
        clause: "암진단비 ①"
        quote: "따라서 병원에서 발급받은 진단서에는 ‘C코드(악성신생물)’라고 기재되어 있더라도 보험약관에서 정한 방법에 따라 암으로 진단확정을 받지 못한 경우*에는 암진단비가 지급되지 않을 수 있습니다."
      - type: 상품약관
        name: "라이나생명 무배당 암걱정없는 표적치료암보험(갱신형) 제3조 유의사항"
        clause: 제3조
        quote: "C73(갑상선의 악성신생물(암))이 림프절로 전이되어 C77(림프절의 이차성 및 상세불명의 악성신생물(암))로 진단된 경우에도 C73(갑상선의 악성신생물(암))에 해당하는 질병으로 봅니다."
        url: https://image.kebhana.com/cont/download/insdocument/provide/L51B14124M_agree.pdf
    note: "확인 상품 4개(라이나 1, KB라이프 2, AXA 1). 유사암 지급 비율은 상품마다 다르므로 'C와 D의 금액 차이가 크다'는 구조만 쓴다. D45·D46·D47.1·D47.3~D47.5는 일부 약관에서 암으로 분류."
    checks:
      - id: CA-CIS
        status: 구현
        grade: 강함
        rule: "질병분류기호는 C(악성 신생물)인데 소견의 조직검사 결과가 제자리암·상피내암·경계성 종양이면 모순 (D→C 변조)"
        source:
          <<: *fss_tip70
          quote: "건강검진으로 위내시경을 받던 도중 종양이 발견되어 절제술 시행 후 ‘암(C코드 부여)’으로 진단 받았으나, 보험회사는 병리보고서 등 의료심사 결과 해당 종양은 상피내암(제자리암 의미)으로 약관상 ‘암’에 해당하지 않는다는 이유로 일반암 진단비의 일부(20%)만 지급하였다."
      - id: CA-DATE
        status: 구현
        grade: 참고
        caveat: "진단 연월일을 결과를 설명한 날로 적는 병원도 있어 결과보고일보다 늦을 수 있음 (보수 원칙으로 확인 필요)"
        rule: "소견에 조직검사 결과보고일이 있으면 진단 연월일과 같아야 한다. 진단 연월일이 결과보고일보다 늦으면 강함(뒤로 미룬 흔적), 이르면 참고"
        source:
          <<: *fss_tip70
          quote: "약관상 암의 진단확정일은 조직검사 시행일이나 진단서 발급일이 아니라 조직검사 보고서상 기재된 ｢결과보고일｣로 인정 되며, 이를 기준으로 보험금 지급 여부와 지급받을 보험금액이 결정됩니다."
      - id: CA-PATH
        status: 서류필요
        rule: "진단서의 진단명·코드와 병리(조직검사) 결과지 진단명·결과보고일을 대조 (결과지 판독기가 있어야 함)"
        source:
          type: 상품약관
          name: "AXA올인원종합보험(갱신형)2203 보험금 청구서류 안내"
          quote: "암 ▣ 조직검사결과지 - 백혈병 : 골수검사지 및 혈액검사결과지 - 뇌/폐/췌장암 : 방사선 판독결과지(조직검사 못할 경우)"
          url: https://www.axa.co.kr/AsianPlatformInternet/doc/internet/public/All-in-One_provision2203(B).pdf
    fraud_cases:
      - type: 금감원
        date: 2025-08-12
        quote: "허위의 병명(‘비외상성두개내출혈’)이 기재된 진단서 및 입‧퇴원 확인서를 SNS로 받아 출력하고 의사 명의의 막도장을 만들어 날인하는 방법으로 기 가입된 보험계약 3개로부터 보험금 1.9억원 편취"
        url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=197027&menuNo=200218
        note: "암 사례는 아님. 진단명 자체가 조작 대상이라는 근거"
    not_found:
      - "C↔D 코드 변조, 유사암을 일반암으로 바꾼 금감원 적발 사례"

  # ───────────────────────────────────────────────────────── 수술
  - id: SURGERY
    name: 수술
    doc: diagnosis
    trigger: {words: ["수술", "절제술", "이식술", "봉합술", "고정술", "성형술"]}
    focus:
      - {field: opinion, what: "수술명·수술일 (수술분류표 종에 따라 금액이 달라짐)"}
    why: "종수술비는 수술분류표의 종(1~5종 또는 1~8종)으로 금액이 정해져, 수술명을 상위 종으로 바꿀 동기가 크다."
    why_source:
      - type: 상품약관
        name: "AXA올인원종합보험(갱신형)2203 (갱신형)수술(1~8종)(시술포함) 특별약관 제1조"
        clause: 제1조①
        quote: "1~8종 수술 및 시술 분류표(【별표37】 참조)에서 정한 수술 및 시술을 받은 경우에는 아래의 금액을 수술(1~8종)(시술포함)보험금으로 보험수익자에게 지급합니다."
        url: https://www.axa.co.kr/AsianPlatformInternet/doc/internet/public/All-in-One_provision2203(B).pdf
      - type: 연구보고서
        name: "보험연구원 연구보고서 2023-13 Ⅱ장"
        clause: Ⅱ.2
        quote: "별도로 첨부된 수술분류표에서 보장하는 수술을 1~5종 또는 1~8종 등으로 분류･열거하고, 그에 따라 보험금을 차등 지급하기 때문에 이른바 종수술비 보장이라고도 불린다."
        url: https://www.kiri.or.kr/pdf/%EC%97%B0%EA%B5%AC%EC%9E%90%EB%A3%8C/%EC%97%B0%EA%B5%AC%EB%B3%B4%EA%B3%A0%EC%84%9C/nre2023-13_2.pdf
    checks:
      - id: SURG-DOCS
        status: 서류필요
        rule: "수술확인서·진단서·진료비 세부산정내역 사이에 수술명·수술코드·수술일자가 같아야 한다"
        source:
          type: 상품약관
          name: "AXA올인원종합보험 보험금 청구서류 안내"
          quote: "수술 ▣ 진단명(질병분류코드), 진단일자, 수술명, 수술시술코드, 수술일자가 포함된 서류 중 택 1(예 : 수술확인서, 진단서, 진료비세부내역서 등)"
          url: https://www.axa.co.kr/AsianPlatformInternet/doc/internet/public/All-in-One_provision2203(B).pdf
      - id: SURG-EXCL
        status: 후보
        rule: "생검·천자·흡인·신경차단·체외충격파쇄석술은 약관상 수술이 아니다 (수술코드 판독기가 있어야 대조 가능)"
        source:
          type: 상품약관
          name: "AXA올인원종합보험 질병 특약 제3조① 수술의 정의"
          quote: "검사 및 진단을 위한 수술(생검(生檢), 복강경검사(腹腔鏡檢査) 등), 기타 수술의 정의에 해당하지 않는 시술(체외 충격파 쇄석술등)은 제외합니다."
          url: https://www.axa.co.kr/AsianPlatformInternet/doc/internet/public/All-in-One_provision2203(B).pdf
    fraud_cases:
      - type: 금감원
        date: 2026-09-28
        quote: "세부유형으로는 사고내용조작 유형 중 진단서 위변조 등 과다청구(+399억원), 자동차사고내용조작(+185억원)이 전년동기 대비 가장 많이 증가하였습니다."
        url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=231823&menuNo=200218
    not_found:
      - "생명보험사 1~5종 수술분류표 상품약관 원문"
      - "수술명·수술코드를 변조한 금감원 개별 적발 사례"

  # ───────────────────────────────────────────────────────── 입원 기간
  - id: ADMISSION
    name: 입원 기간
    doc: diagnosis
    trigger: {fields: ["dates.admit", "dates.discharge"], words: ["입원"]}
    focus:
      - {field: dates.admit, what: "입원일"}
      - {field: dates.discharge, what: "퇴원일 (입원일당은 입원일수에 비례)"}
      - {field: opinion, what: "소견에 적힌 입원·퇴원 날짜"}
    why: "입원일당은 입원일수에 비례하고, 금감원이 생성형 AI로 입·퇴원 기간을 늘린 위조 사례를 공개했다."
    why_source:
      - <<: *std_terms
        clause: "기본형 실손의료보험 <붙임1> 용어의 정의 '입원'"
        quote: "의사가 피보험자의 질병 또는 상해로 인하여 치료가 필요하다고 인정한 경우로서 자택 등에서 치료가 곤란하여 의료기관 또는 이와 동등하다고 인정되는 의료기관에 입실하여 계속하여 6시간 이상 체류하면서 의사의 관찰 및 관리 하에 치료를 받는 것"
      - <<: *std_terms
        clause: "실손의료보험 특별약관1·2 제3조 (비급여 병실료)"
        quote: "1일 평균금액은 입원기간 동안 비급여 병실료 전체를 총 입원일수로 나누어 산출합니다."
    checks:
      - id: ADM-OPINION
        status: 구현
        grade: 참고
        caveat: "소견의 날짜가 이전 입원이나 다른 병원 입원을 가리킬 수 있음 (보수 원칙으로 확인 필요)"
        rule: "입원·퇴원 연월일 칸과 소견에 적힌 입원·퇴원 날짜가 다르면 모순 (칸만 고친 기간 늘리기)"
        source:
          <<: *fss_260604
          quote: "부산 20대 A씨는 실제 병원에서 발급받은 입·통원 확인서를 촬영하여 생성형 AI에 업로드 후 입원·퇴원 기간을 늘려달라고 요청, 위조 서류를 생성하였음"
      - id: ADM-RECEIPT
        status: 서류필요
        rule: "진단서·입퇴원확인서의 입원 기간과 진료비 계산서·영수증의 진료기간·입원료가 서로 맞아야 한다 (두 서류를 함께 넣는 검사 필요)"
        source:
          <<: *std_terms
          clause: "기본형 실손의료보험 보험금 청구서류"
          quote: "입원치료확인서, 의사처방전(처방조제비)"
    fraud_cases:
      - <<: *fss_260604
        date: 2026-06-04
        quote: "입원·퇴원 기간을 늘려달라고 요청, 위조 서류를 생성하였음"
      - type: 금감원
        date: 2025-09-08
        quote: "141일 입원기간 중 처방된 면역주사제 총 273개 전부가 허위처방이었으며"
        url: https://www.fss.or.kr/fss/bbs/B0000188/view.do?nttId=200974&menuNo=200218
    not_found:
      - "입원일수 = 퇴원일 - 입원일 + 1 계산식의 공식 문장 (상품약관마다 다름)"
      - "심평원 입원료 산정지침 원문 (hira.or.kr 접속 실패)"

  # ───────────────────────────────────────────────────────── 상해/질병 구분
  - id: INJURY
    name: 상해·질병 구분
    doc: diagnosis
    trigger: {words: ["넘어져", "넘어지며", "다쳐", "사고", "열탕", "추락", "교통사고", "부딪"]}
    focus:
      - {field: diagnoses, what: "질병분류기호 첫 글자 (S00~T98 손상 / 그 외 질병)"}
      - {field: opinion, what: "사고 경위"}
    why: "상해는 '급격하고도 우연한 외래의 사고'로 정의되어 질병과 담보·금액이 다르다."
    why_source:
      - <<: *std_terms
        clause: "질병·상해보험(손해보험 회사용) 제2조(용어의 정의) 2호 가목"
        quote: "가. 상해: 보험기간 중에 발생한 급격하고도 우연한 외래의 사고로 신체(의수, 의족, 의안, 의치 등 신체보조장구는 제외하나, 인공장기나 부분 의치 등 신체에 이식되어 그 기능을 대신할 경우는 포함합니다)에 입은 상해를 말합니다."
      - <<: *std_terms
        clause: "생명보험 표준약관 <부표 4> 재해분류표"
        quote: "① 한국표준질병ㆍ사인분류상의 (S00∼Y84)에 해당하는 우발적인 외래의 사고"
    checks:
      - id: INJ-CODE
        status: 구현
        grade: 참고
        rule: "소견에 외래 사고 경위(넘어짐·사고·열탕 등)가 있는데 주 질병분류기호가 S00~T98(손상) 밖이면 확인 (질병을 상해로, 상해를 질병으로 바꿔 쓴 경우)"
        source:
          <<: *std_terms
          clause: "생명보험 표준약관 <부표 4> 재해분류표"
          quote: "① 한국표준질병ㆍ사인분류상의 (S00∼Y84)에 해당하는 우발적인 외래의 사고"
    fraud_cases: []
    not_found:
      - "상해↔질병을 바꿔 쓴 진단서 조작을 다룬 금감원 보도자료"

  # ───────────────────────────────────────────────────────── 진단일·계약일
  - id: CONTRACT_DATE
    name: 진단일과 보장개시일
    doc: diagnosis
    trigger: {kcd: ["C00-C97", "D00-D09", "D37-D48"]}   # 면책(90일)·감액(1년)이 있는 암 담보만 (모든 진단서에 켜면 주목이 너무 많아짐)
    focus:
      - {field: dates.diagnosis, what: "진단 연월일 (보장개시일·면책기간·감액기간 경계)"}
    why: "계약 전 진단은 알릴 의무 위반·사기에 의한 계약이 되고, 암은 계약 후 90일 안이면 면책, 1년 안이면 50% 감액이라 진단일을 뒤로 미룰 동기가 있다."
    why_source:
      - <<: *std_terms
        clause: "질병·상해보험 제17조(사기에 의한 계약)"
        quote: "진단서 위·변조 또는 청약일 이전에 암 또는 인간면역결핍바이러스(HIV) 감염의 진단 확정을 받은 후 이를 숨기고 가입하는 등 사기에 의하여 계약이 성립되었음을 회사가 증명하는 경우에는"
      - type: 상품약관
        name: "라이나생명 무배당 암걱정없는 표적치료암보험(갱신형) 제31조⑤"
        clause: 제31조⑤
        quote: "“암”에 대한 보장개시일(이하 “암보장개시일”이라 합니다)은 최초계약의 경우 계약일부터 그 날을 포함하여 90일이 지난 날의 다음 날로 하고"
        url: https://image.kebhana.com/cont/download/insdocument/provide/L51B14124M_agree.pdf
    checks:
      - id: DATE-CONTRACT
        status: 서류필요
        rule: "진단 연월일을 계약일(보장개시일)과 비교: 청약일 전이면 사기 취소 사유, 계약일+90일·1년 경계 근처면 주목 (계약 정보가 있어야 함)"
        source:
          <<: *std_terms
          clause: "질병·상해보험 제25조 【보장개시일】"
          quote: "또한, 보장개시일을 계약일로 봅니다."
    fraud_cases: []
    not_found:
      - "진단일을 계약 이후로 옮긴 조작의 금감원 개별 적발 사례"

  # ───────────────────────────────────────────────────────── 영수증 비급여
  - id: NONPAY
    name: 영수증 비급여
    doc: receipt
    trigger: {fields: ["rows.*.nonpay"]}
    focus:
      - {field: "rows.*.nonpay", what: "비급여 금액이 있는 행 (특히 이학요법·주사료·MRI)"}
      - {field: visit.start, what: "진료일 (통원 쪼개기: 같은 금액이 연속 날짜에 반복)"}
    why: "실손은 급여 본인부담금의 80%, 비급여의 70%(중증)·50%(비중증)를 보상해 비급여 금액이 곧 보험금이다. 이학요법·주사료·MRI는 별도 한도로 관리되는 항목이다."
    why_source:
      - <<: *std_terms
        clause: "실손의료보험 특별약관1(중증 비급여) 제3조"
        quote: "의 70%에 해당하는 금액"
      - <<: *std_terms
        clause: "실손의료보험 특별약관1 제3조 3대비급여 <표1>"
        quote: "350만원 이내에서 50회까지 보상"
    checks:
      - id: NONPAY-SPLIT
        status: 서류필요
        rule: "통원 영수증 여러 장이 연속 날짜에 1일 통원 한도 근처의 같은 금액으로 반복되면 진료비 쪼개기 의심 (여러 장을 함께 넣는 검사 필요)"
