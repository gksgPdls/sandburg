# 로직 엔진 규칙 데이터 — generator/forgery/config/codebook.yaml 에서 규칙에 필요한 공식 근거 값만 옮김 (생성 확률은 뺌)
# 근거 (codebook.yaml 주석 원문 요약)
#  institution_types.outpatient_rate : 국민건강보험법 시행령 [별표 2] 제1호 외래 본인부담률 (동 지역)
#  institution_types.addon_rate      : 「건강보험요양급여비용」 제1편 제1부 Ⅱ 요양기관 종별가산율
#  inpatient_rate / meal_rate        : 시행령 [별표 2] 입원 20%, 식대 50%
#  rooms.rate                        : 별지 제6호서식 항목별 설명 1 (병원급 2인실 40%·3인실 30%)
#  sat_morning_from                  : 토요일 오전 진찰료 가산 시행일 (의원 2024, 병원급 2025)
#  holidays                          : 관공서의 공휴일에 관한 규정 (일요일은 코드에서 항상 공휴일)
#  regions                           : [시도 시군구, 관할 세무서 코드번호] — 국세청 세무서별 기본사항 (한 세무서가 구 전체를 관할하는 곳만)
#  bizno_mid                         : 사업자등록번호 가운데 2자리 개설 주체 구분코드
