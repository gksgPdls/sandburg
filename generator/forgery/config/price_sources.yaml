# 항목별 공식 단가 출처 — 단가표를 만드는 도구가 읽음
#   2026: tools/fetch_prices.py → config/prices.yaml (심평원 오픈 API)
#   2024·2025: tools/build_book_prices.py (수가) + tools/build_list_prices.py (약가) → config/prices_<연도>.yaml
#
#  fee:  수가기준정보조회서비스 getDiagnossMdfeeList, 수가코드(mdfeeCd)
#        단가: 의원 = unprc1, 병원·종합병원 = unprc2 (종별가산 전 금액 = 점수 × 환산지수, 10원 반올림)
#  drug: 약가기준정보조회서비스 getDgamtList, 주성분코드(gnlNmCd) + 검색어(q, 품목명)
#        단가: 같은 주성분코드 급여 품목의 상한금액(mxCprc) 최빈값 (동률이면 낮은 값)
#              valid_from 이후에 상한금액이 바뀐 품목은 제외
#        식대(Y·Z코드)는 점수 없이 금액으로 고시됨 → 금액 그대로
#        모든 수가코드는 기본 코드(세부 코드 없음)를 씀: 검체검사 질가산·수탁, 영상의학과전문의 판독 가산,
#        소아 가산, 식대 인력기준 미충족 등 기관·환자 조건에 따른 세부 코드는 쓰지 않음
#  notice: 보건복지부 고시 금액 (API 아님) — 제증명수수료 상한
#  name: 기록용 이름 (약제는 제품명 대신 성분명·함량)
#  n:    수량 배수 (경구약 1일 복용 정수)
#  항목 하나가 여러 코드의 합이면 목록으로 적음 (예: CBC = 4개 항목)
#  진찰료·입원료·식대·의약품관리료는 종별 수가코드가 따로 있어 항목키에 종별(clinic/hospital/general)을 붙임

