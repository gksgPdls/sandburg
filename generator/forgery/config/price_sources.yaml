# 수가 항목별 공식 단가 출처 (심평원 오픈 API) — tools/fetch_prices.py 가 읽어서 config/prices.yaml 을 만듦
#
#  fee:  수가기준정보조회서비스  getDiagnossMdfeeList  수가코드(mdfeeCd)
#        단가: 의원 = unprc1, 병원·종합병원 = unprc2
#  drug: 약가기준정보조회서비스  getDgamtList          주성분코드(gnlNmCd) + 검색어(q, 품목명)
#        단가: 같은 주성분코드의 급여 품목 상한금액(mxCprc) 중 최빈값 (동률이면 낮은 값)
#              valid_from 이후에 상한금액이 바뀐 품목은 제외 (생성 기간 내내 같은 금액이었던 품목만 사용)
#  mat:  치료재료정보조회서비스  getPaymentNonPaymentList1.2  중분류명(mdivCdNm) + 검색어(q, 품목명)
#        단가: 같은 중분류의 급여 품목 상한단가(mxUnprc) 중 최빈값 (동률이면 낮은 값)
#  npay: 비급여진료비정보조회서비스  getNonPaymentItemClcdList  비급여코드(npayCd)
#        단가: 종별(병원 / 종합병원) 공표 최소·중간값·최대 → 생성 시 이 범위에서 뽑음 (generator/pricing.py)
#        의원은 공개 대상이 아니라 단가 없음 → 의원에서는 이 항목을 생성하지 않음
#  notice: 보건복지부 고시 금액 (ref 에 고시명)
#  name: 기록용 이름 (약제는 제품명 대신 성분명·함량)
#  n:    수량 배수 (예: 요검사 시험지봉 10항목, 경구약 1일 복용 정수)
#
#  항목 하나가 여러 코드의 합이면 목록으로 적음 (예: 간기능 = AST + ALT)
#  진찰료·입원료·식대는 종별 수가코드가 따로 있어 항목키 끝에 종별(clinic/hospital/general)을 붙임

valid_from: "2026-01-01"   # 단가 기준일: 2026년 수가 적용일. 진료일은 이 날 이후로만 생성 (codebook.yaml date_range)

