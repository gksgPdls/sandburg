# 서식은 공식 PDF 레이아웃 그대로 다시 그리고, "값을 적는 방식"만 병원(EMR)마다 다르게 뽑음 (값 자체는 바꾸지 않음)
# 각 값은 사건마다 확률로 하나를 뽑음 (generator/generate.py › pick_variant)

receipt:
  zero_fill:        {true: 0.9, false: 0.1}       # 금액 없는 칸에 0 표기 / 공란
  patient_type:     {건강보험: 0.8, 건보: 0.2}     # 환자구분 표기
  mark:             {"■": 0.6, "√": 0.3, "V": 0.1}  # [ ] 체크 표시 문자
  receipt_no_style: {dash: 0.6, plain: 0.4}       # 20250314-0014 / 2025031400014

diagnosis:
  english_name:     {true: 0.4, false: 0.6}       # 병명 옆 영문 병기
  final_diagnosis:  {true: 0.85, false: 0.15}     # 최종진단 / 임상적 추정
  mark:             {"√": 0.8, "V": 0.2}          # [ ] 체크 표시 (작성방법: √ 표시)
