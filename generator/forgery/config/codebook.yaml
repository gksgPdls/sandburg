# ════════════════════════════════════════════════════════════════
#  가상 데이터 생성 코드북 — 생성 규칙의 모든 수치·목록은 여기서만 정의
#  설명 문서: 가상의료문서_생성로직_보고서_최종.docx
#
#  원칙: 공식 자료로 확인한 값만 생성한다. 근거가 애매하거나 공식 자료가 없는 항목은 만들지 않는다.
#   - 금액: 심평원 공식 급여 단가표(config/prices*.yaml)와 보건복지부 고시 제증명수수료 상한만. 비급여는 만들지 않음
#   - 진단: 심평원 상병마스터의 완전코드만, 병명·영문명은 상병마스터 표기 그대로 (실행 시 대조)
#   - 시각: 외래는 평일 낮·야간, 토요일, 공휴일 진료를 만들고 책자 규정대로 시간 가산 (입원은 평일 오전 입원)
#  확률(weight, p_*, *_prob)은 어떤 사건을 만들지 정하는 설정값이다 (실제 분포를 맞춘 값 아님)
# ════════════════════════════════════════════════════════════════

# ── 1. 요양기관 종류 ────────────────────────────────────────────
#  outpatient_rate: 외래 본인부담률 — 국민건강보험법 시행령 [별표 2] 제1호 (동 지역)
#  addon_rate: 요양기관 종별가산율 — 「건강보험요양급여비용」 제1편 제1부 Ⅱ (2024·2025·2026 같음)
#              fee_items 의 addon: true 항목에만 적용. 단가 × (1 + 가산율), 원 미만 4사5입 (제1부 Ⅰ.1 단서)
#  can_admit: 입원 사건을 만들 수 있는 종별 (의원 입원은 만들지 않음)
institution_types:
  clinic:   {label: "의원급·보건기관", weight: 0.65, outpatient_rate: 0.30, addon_rate: 0.00, can_admit: false}
  hospital: {label: "병원급",         weight: 0.22, outpatient_rate: 0.40, addon_rate: 0.05, can_admit: true}
  general:  {label: "종합병원",       weight: 0.13, outpatient_rate: 0.50, addon_rate: 0.10, can_admit: true}

# ── 2. 입원 ────────────────────────────────────────────────────
#  본인부담률: 입원 20%, 식대 50% (시행령 [별표 2]),
#             병원급 입원료 2인실 40%·3인실 30% (별지 제6호서식 항목별 설명 1)
#  입원·퇴원 시각: 둘 다 06~12시 (오전)로 둠 → 입원료 일수 = 박 수
#             (책자 산정지침 2-라: 1일 = 정오~정오, 06~12시 입원·12~18시 퇴원은 별도 산정 없음)
#             식사 = 입원일 점심·저녁 + 중간 날 3식 + 퇴원일 아침 = 3 × 박 수
#  재원 15일 이내라 입원료 체감(16일째부터 90%)은 해당 없음
inpatient_rate: 0.20
meal_rate: 0.50
rooms:   # price_key → ROOM_<병실>_<종별>_G<간호등급>[_metro] (price_sources.yaml)
  room_4: {label: "4인실", row: room_4,  rate: 0.20, weight: 0.70, price_key: ROOM_4}
  room_3: {label: "3인실", row: room_23, rate: 0.30, weight: 0.15, price_key: ROOM_3}
  room_2: {label: "2인실", row: room_23, rate: 0.40, weight: 0.15, price_key: ROOM_2}
#  간호관리료 차등제 등급 — 기관 속성 (기관마다 한 번 뽑음). 등급마다 입원료 코드가 다름
#  확률: 심평원 정책동향 「간호관리료 차등제 개편」의 2024년 1분기 서울 소재 기관 등급 분포
#        (https://repository.hira.or.kr/handle/2019.oak/3471, 미신고 기관 제외)
nurse_grades:
  general:  {S: 0.186, A: 0.395, "1": 0.163, "2": 0.070, "3": 0.023, "4": 0.000, "5": 0.163}
  hospital: {A: 0.383, "1": 0.077, "2": 0.077, "3": 0.059, "4": 0.045, "5": 0.072, "6": 0.270}
lowest_grade: {general: "5", hospital: "6"}   # 소재지(서울특별시·광역시 구 → _metro)에 따라 코드가 갈리는 등급
#  식대 = 기본식사(일반식) + 일반식 가산(영양사·조리사, 1식당) + 직영 가산 — 기관 속성 (기관마다 한 번 뽑음)
meal_addons: {MEAL_DIETITIAN: 0.80, MEAL_COOK: 0.80, MEAL_DIRECT: 0.60}

# ── 3. 수가 항목 ────────────────────────────────────────────────
#  name: 계산서·data.json 표기 / row: 계산서 행 (docgen/render.py RECEIPT_ROWS)
#  모든 항목은 급여 일부본인부담. 금액 = 단가 × 수량 × 일수. 단가 = config/prices*.yaml 의 같은 키
#  addon: true → 종별가산 대상 (제2부 제2~10·13·14·19·20장 행위)
#                대상 아님: 제1장(진찰료·입원료·의약품관리료), 검체검사(제2장 제1절),
#                방사선 영상진단(제3장 제1·2절), 약제, 식대
#  same_day: {다른 항목: 대신 쓸 키} → 같은 날 그 항목이 있으면 대신 쓸 키의 단가로 산정
fee_items:
  # 영상진단료
  XR_KNEE:     {name: "무릎 단순촬영 2매",       row: imaging}
  XR_SHOULDER: {name: "어깨 단순촬영 2매",       row: imaging}
  XR_LSPINE:   {name: "요추 단순촬영 3매",       row: imaging}
  XR_CHEST:    {name: "흉부 단순촬영 1매",       row: imaging}
  XR_ABD:      {name: "복부 단순촬영 1매",       row: imaging}
  XR_PNS:      {name: "부비동 단순촬영 1매",     row: imaging}
  # 재활 및 물리치료료 (이학요법, 사-)
  PT_HOT:      {name: "표층열치료",              row: rehab, addon: true, same_day: {PT_DEEP: PT_HOT_HALF}}
  PT_HOT_HALF: {name: "표층열치료(심층열 동시)", row: rehab, addon: true}   # MM015: 사-101 주2 소정점수 50%
  PT_DEEP:     {name: "심층열치료",              row: rehab, addon: true}
  PT_ICT:      {name: "간섭파전류치료",          row: rehab, addon: true}
  PT_TENS:     {name: "경피적전기신경자극치료",  row: rehab, addon: true}
  INJ_TPI:     {name: "근막동통유발점주사자극치료", row: rehab, addon: true}
  # 주사료 — 행위료 (마-)
  INJ_IM:      {name: "근육주사 행위료",         row: inj_act, addon: true}
  INJ_IV:      {name: "정맥내 일시주사 행위료",  row: inj_act, addon: true}
  INJ_IVDRIP:  {name: "정맥내 점적주사 행위료",  row: inj_act, addon: true}
  # 주사료 — 약품비 (1앰플·1병·1백)
  D_DICLO:     {name: "디클로페낙나트륨 주 75mg", row: inj_drug}
  D_DEXA:      {name: "덱사메타손 주 5mg",       row: inj_drug}
  D_TRIAM:     {name: "트리암시놀론 주 40mg",    row: inj_drug}
  D_CHLOR:     {name: "클로르페니라민 주 4mg",   row: inj_drug}
  D_LIDO:      {name: "리도카인 주 2% 20mL",     row: inj_drug}
  D_HS1000:    {name: "하트만 1000mL",           row: inj_drug}
  D_FAMO:      {name: "파모티딘 주 20mg",        row: inj_drug}
  D_METO:      {name: "메토클로프라미드 주 10mg", row: inj_drug}
  D_CEFA:      {name: "세파졸린 주 1g",          row: inj_drug}
  # 투약 및 조제료 (입원 원내투약 1일분)
  MED_ACT_DAY: {name: "입원환자 조제·복약지도료", row: med_act, addon: true}   # 라-2 (제4장)
  MED_PO_A:    {name: "경구약 1일분(아세클로페낙·레바미피드)", row: med_drug}
  # 처치 및 수술료 (자-)
  INJ_IL:      {name: "병변내주입요법(25㎠미만)", row: proc, addon: true}
  PRC_CRYO:    {name: "사마귀제거술(냉동)",      row: proc, addon: true}
  PRC_NEB:     {name: "상기도 증기흡입치료",     row: proc, addon: true}
  PRC_EAR:     {name: "외이도이물·이구전색제거", row: proc, addon: true}
  PRC_LID:     {name: "맥립종 절개술",           row: proc, addon: true}
  PRC_LID_OFFHOURS: {name: "맥립종 절개술(야간·토요·공휴 가산)", row: proc, addon: true}
  # 검사료 — 검체검사 (가산 대상 아님)
  LAB_CBC:     {name: "일반혈액검사(CBC)",       row: lab}
  LAB_CRP:     {name: "C반응성단백(CRP)",        row: lab}
  LAB_LFT:     {name: "간기능검사(AST/ALT)",     row: lab}
  LAB_BUN:     {name: "신기능검사(BUN/Cr)",      row: lab}
  LAB_HBA1C:   {name: "당화혈색소(HbA1c)",       row: lab}
  LAB_LIPID:   {name: "지질검사(총콜레스테롤·TG·HDL·LDL)", row: lab}
  LAB_KOH:     {name: "진균 KOH 도말검사",       row: lab}
  LAB_IGE:     {name: "알레르기 특이IgE 검사",   row: lab}
  # 검사료 — 기능·내시경검사 (가산 대상)
  LAB_ECG:     {name: "심전도검사",              row: lab, addon: true}
  LAB_PTA:     {name: "순음청력검사",            row: lab, addon: true}
  LAB_TYMP:    {name: "고막운동성검사",          row: lab, addon: true}
  LAB_ENDO:    {name: "비인강경검사",            row: lab, addon: true}
  LAB_SLIT:    {name: "세극등현미경검사",        row: lab, addon: true}
  LAB_IOP:     {name: "안압측정",                row: lab, addon: true}
  LAB_REF:     {name: "굴절검사",                row: lab, addon: true}

# 진료 시각별 가산 (외래)
#  진찰료 (가-1 주3·주5)
#   야간: 평일 18시~익일 09시, 토요일 13시 이후 → 진찰료 + 기본진찰료 30%  (CONSULT_<초진/재진>_<종별>_NIGHT)
#   공휴일: 관공서의 공휴일에 관한 규정의 공휴일 (일요일 포함) → 같은 30%     (…_HOLIDAY)
#   토요일 09시 후~13시 전: 기본진찰료 30% 를 별도 1줄로 산정               (…_SAT)
#     2024년은 의원급만, 2025년부터 병원급(병원·종합병원)도 해당 (2024·2025 책자 가-1 주5 문구 차이)
#  처치 (제9장 산정지침 ⒇): 의원 외래에서 18시~09시·토요일·공휴일에 (별표8) 항목을 하면 30% 가산
#   우리 처치 항목 중 별표8 에 있는 것은 맥립종 절개술(S5400)뿐 → PRC_LID 를 PRC_LID_OFFHOURS(S5400080)로
#  응급진료에만 붙는 가산(검사·처치·마취 50% 등)은 응급 사건을 만들지 않으므로 해당 없음
sat_morning_from: {clinic: "2024-01-01", hospital: "2025-01-01", general: "2025-01-01"}
offhours_items: {PRC_LID: PRC_LID_OFFHOURS}
#  외래 진료 요일·시각 (설정값): 요일 종류를 먼저 고르고 그 안의 시각 구간을 고름. 시각은 분 단위 무작위
#   holiday = 일요일 또는 공휴일, saturday = 공휴일이 아닌 토요일, weekday = 그 외
#   09시 이전 진료는 만들지 않음 (2026년 '09시 이전 정규진료' 가산 규정 해석을 피함)
visit_days:
  weekday:  {weight: 0.80, slots: {day: [0.85, "09:00", "17:59"], night: [0.15, "18:00", "20:59"]}}
  saturday: {weight: 0.15, slots: {sat_morning: [0.80, "09:01", "12:59"], night: [0.20, "13:00", "15:59"]}}
  holiday:  {weight: 0.05, slots: {holiday: [1.00, "09:00", "17:59"]}}

# 의약품관리료 (가-11, 제1장 — 가산 대상 아님): 원내에서 약을 투약하면 자동으로 1줄
#  외래: 주사약 등 원내 투약이 있는 방문 → MEDKEEP_OUT_<종별> (의원 1일분, 병원·종합병원 방문당)
#  입원: 입원기간 중 투약 → MEDKEEP_IN_<종별>_<투약일수> (투약일수 = 입원료 일수)
medkeep_rows: [inj_drug, med_drug]          # 이 행의 약이 있으면 의약품관리료 산정
medkeep_row: med_act                        # 의약품관리료를 적는 계산서 행 (투약 및 조제료 · 행위료)

# ── 4. 진료과 ───────────────────────────────────────────────────
#  diagnoses: 심평원 상병마스터(2025.9)의 완전코드. name·en 은 상병마스터 표기 그대로
#             (assets/references/hira_kcd_master_2025_9.csv 와 실행 시 대조, 다르면 중단)
#             xray: 이 진단의 단순촬영 항목 (처방의 $xray)
#  revisit_prob: 외래 재진(첫 진료 후 3~30일 뒤 방문) 확률
#  orders: 외래 처방 묶음. p_first/p_revisit: 초진/재진일 때 묶음이 나올 확률
#          dx: 이 진단일 때만 (생략 시 전체), items: [항목키, 최소수량, 최대수량]
#          "A|B" = 둘 중 하나만 (예: 간섭파전류치료와 경피적전기신경자극치료는 같은 날 함께 넣지 않음)
#  admit_dx / admission_prob / los_days: 입원 가능 진단, 병원급 이상에서 입원할 확률, 재원일수(박) 범위
#  inpatient_orders: 입원 처방 묶음. p: 나올 확률, per_day: true 면 수량 × 입원 일수
departments:
  피부과:
    weight: 0.17
    revisit_prob: 0.45
    diagnoses:
      - {code: L20.9, name: "상세불명의 아토피성 피부염", en: "Atopic dermatitis, unspecified"}
      - {code: L30.9, name: "상세불명의 피부염", en: "Dermatitis, unspecified"}
      - {code: L50.0, name: "알레르기성 두드러기", en: "Allergic urticaria"}
      - {code: L23.9, name: "상세불명 원인의 알레르기성 접촉피부염", en: "Allergic contact dermatitis, unspecified cause"}
      - {code: L21.9, name: "상세불명의 지루피부염", en: "Seborrhoeic dermatitis, unspecified"}
      - {code: L29.9, name: "상세불명의 가려움", en: "Pruritus, unspecified"}
      - {code: L70.0, name: "보통여드름", en: "Acne vulgaris"}
      - {code: B35.1, name: "손발톱백선", en: "Tinea unguium"}
      - {code: B35.3, name: "발백선", en: "Tinea pedis"}
      - {code: B07, name: "바이러스사마귀", en: "Viral warts"}
      - {code: B02.9, name: "합병증이 없는 대상포진", en: "Zoster without complication"}
    orders:
      - {id: KOH,      p_first: 1.00, p_revisit: 0.00, dx: [B35.1, B35.3], items: [[LAB_KOH, 1, 1]]}
      - {id: CRYO,     p_first: 1.00, p_revisit: 1.00, dx: [B07],   items: [[PRC_CRYO, 1, 1]]}
      - {id: ANTIHIST, p_first: 0.50, p_revisit: 0.20, dx: [L50.0, L20.9, L23.9, L29.9], items: [[INJ_IM, 1, 1], [D_CHLOR, 1, 1]]}
      - {id: STEROID,  p_first: 0.30, p_revisit: 0.10, dx: [L23.9, L30.9], items: [[INJ_IM, 1, 1], [D_DEXA, 1, 1]]}
      - {id: IL_INJ,   p_first: 0.10, p_revisit: 0.15, dx: [L20.9, L70.0], items: [[INJ_IL, 1, 1], [D_TRIAM, 1, 1]]}
      - {id: IGE,      p_first: 0.15, p_revisit: 0.00, dx: [L20.9, L50.0], items: [[LAB_IGE, 1, 1]]}

  정형외과:
    weight: 0.22
    revisit_prob: 0.45
    admit_dx: [M54.56, M51.2]
    admission_prob: 0.50
    los_days: [3, 7]
    diagnoses:
      - {code: M75.1, name: "회전근개증후군", en: "Rotator cuff syndrome", xray: XR_SHOULDER}
      - {code: M75.0, name: "어깨의 유착성 관절낭염", en: "Adhesive capsulitis of shoulder", xray: XR_SHOULDER}
