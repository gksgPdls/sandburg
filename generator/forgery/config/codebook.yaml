# ── 5. 진단서 ───────────────────────────────────────────────────
#  소견: 그 사건에 실제로 생성된 처방(계산서 행)으로 문장을 만듦 — 생성되지 않은 치료·치료기간은 적지 않음
#        {acts} = 아래 row_acts 로 바꾼 처방 행 목록, {date}/{admit}/{discharge} = 날짜
#  발병일·비고는 진료기록 없이 정할 수 없어 비워 둠
#  진단서 발급 수수료: 보건복지부고시 제2021-34호 일반진단서 상한금액 (계산서 '제증명수수료' 행, 비급여)
#   상한 이하의 실제 금액은 기관마다 다르므로 고시된 상한금액을 씀. 같은 계산서에 함께 적는 경우만 (설정값)
cert_fee_key: CERT_DX
cert_fee_on_receipt_prob: 0.60
opinion_templates:
  outpatient:
    - "상기 환자는 위 상병으로 {date} 본원 외래에서 {acts} 시행하였음."
    - "위 상병으로 {date} 본원 외래 내원하여 {acts} 시행함."
    - "상기 병명으로 {date} 외래 진료하였으며 {acts} 시행함."
  inpatient:
    - "상기 환자는 위 상병으로 {admit}부터 {discharge}까지 본원에 입원하여 {acts} 시행하였음."
    - "위 상병으로 {admit} 입원하여 {acts} 시행 후 {discharge} 퇴원함."
row_acts:   # 계산서 행 → 소견에 쓰는 말 (나열 순서)
  consult: 진찰
  lab: 검사
  imaging: 방사선 검사
  inj_act: 주사 치료
  med_drug: 약물 치료
  rehab: 물리치료
  proc: 처치
purposes: {"보험회사 제출용": 0.70, "회사 제출용": 0.15, "학교 제출용": 0.05, "기타 제출용": 0.10}
sub_diagnosis_prob: 0.20     # 같은 과의 다른 진단을 부 진단으로

# ── 6. 결제 ────────────────────────────────────────────────────
payment_mode: {card: 0.70, cash: 0.15, mixed: 0.15}
